- slug: file-sorter
  title: Сортировщик файлов
  summary: Скрипт, наводящий порядок в папке «Загрузки» за секунду.
  description: |
    Раскладывает файлы по папкам по типу: документы, картинки, архивы, видео.

    | Расширение | Папка |
    |---|---|
    | .jpg .png | Images |
    | .pdf .docx | Documents |
    | .zip .rar | Archives |

    Использует `pathlib` и `shutil`, умеет работать в режиме «только показать».
