- slug: weather-bot
  title: Telegram-бот погоды
  summary: Бот, который каждое утро присылает прогноз погоды для вашего города.
  description: |
    ## Задача
    Хотелось получать прогноз без открытия приложений — прямо в Telegram.

    ## Решение
    - бот на **aiogram 3** с асинхронной обработкой сообщений;
    - планировщик **APScheduler** отправляет прогноз по расписанию;
    - данные берутся из OpenWeatherMap API и кэшируются, чтобы не тратить лимиты.

    ```python
    @router.message(Command("weather"))
    async def weather(message: Message):
        data = await api.get_forecast(city="Moscow")
        await message.answer(format_forecast(data))
    ```

    ## Результат
    Бот работает 24/7 в Docker-контейнере на VPS.
  stack: [Python, aiogram, Docker, API]
  image: img/weather-bot.svg
  github: https://github.com/Xagan6_9/weather-bot
  featured: true
  date: 2025-09-01

